<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    프로젝터 렌즈에서 나온 빛이 사다리꼴 화면을 만든다.
    사다리꼴 자체가 이 앱의 정체(키스톤 보정)이고, 재생 삼각형으로 플레이어임을 나타낸다.
    24px 까지 줄여도 형태가 유지되도록 요소를 셋으로 제한했다.
  -->
  <defs>
    <linearGradient id="beam" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0" stop-color="#E8471C"/>
      <stop offset="0.55" stop-color="#F5941F"/>
      <stop offset="1" stop-color="#FFC94A"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#171C2B"/>

  <!-- 렌즈 -->
  <circle cx="20" cy="64" r="7" fill="#F5941F"/>

  <!-- 키스톤 보정된 투사면 -->
  <polygon points="34,47 104,21 104,107 34,81" fill="url(#beam)"/>

  <!-- 재생 -->
  <polygon points="60,52 88,64 60,76" fill="#171C2B"/>
</svg>
